<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptoric Guard - Linkvertise Demo</title>
    
    <!-- Load Cryptoric Guard v1.3.0 (Crypto + HWID) -->
    <script src="https://unpkg.com/cryptoric-guard@1.3.0/dist/cryptoric-guard.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>

    <main class="container">
        <header>
            <h1>👼 Cryptoric Guard</h1>
            <p>Live Anti-Bypass Demonstration (HWID Edition)</p>
        </header>

        <section class="card">
            <h2>1. Configuration</h2>
            <div class="input-group">
                <label for="publisherId">Linkvertise Publisher ID</label>
                <input type="text" id="publisherId" placeholder="e.g. 523671" value="523671">
            </div>
            <div class="input-group">
                <label for="targetUrl">Target URL (Where does it go?)</label>
                <input type="text" id="targetUrl" placeholder="https://example.com/reward" value="https://example.com/reward">
            </div>
        </section>

        <section class="card">
            <h2>2. Action</h2>
            <p>Clicking this button will initiate a simulated Linkvertise flow. Cryptoric Guard will actively monitor the session, generate a unique Hardware ID, and sign backend requests.</p>
            <button id="startFlowBtn" class="primary-btn">Generate Linkvertise Key 🔗g</button>
        </section>

        <section class="card terminal-card">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="title">Guard Terminal</span>
            </div>
            <div class="terminal-body" id="terimnal">
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
